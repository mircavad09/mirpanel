<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Səhifə tapılmadı | Mirpanel</title>
  <link rel="icon" href="/assets/logo.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #070707;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    main { max-width: 560px; text-align: center; }
    h1 { margin: 0 0 14px; font-size: clamp(34px, 8vw, 64px); }
    p { margin: 0 0 24px; color: #b8b8b8; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 10px;
      background: #ffd400;
      color: #111;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Axtardığınız səhifə tapılmadı.</p>
    <a href="/">Ana səhifəyə qayıt</a>
  </main>
</body>
</html>
